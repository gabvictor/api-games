name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Gerar o banco a partir do dataset e rodar os testes da API
        run: |
          python etl.py dataset catalogo_inicial.db
          python consolidar.py catalogo_inicial.db
          python -m unittest discover -s tests
      - name: Exportar os dados estáticos (site sem backend)
        run: python ferramentas/exportar_estatico.py
      - name: Incluir os CSVs do dataset para download na página "Sobre"
        run: mkdir -p web/dataset && cp dataset/*.csv web/dataset/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
